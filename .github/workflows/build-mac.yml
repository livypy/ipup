name: Build macOS reporter

on:
  workflow_dispatch: {}   # 手动触发
  push:
    paths: ['reporter.py']  # 或改动 reporter.py 时自动打包

jobs:
  build-mac:
    runs-on: macos-14      # Apple Silicon (M1)，如需 Intel 用 macos-13
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests cryptography pyinstaller

      - run: pyinstaller --onefile reporter.py

      - uses: actions/upload-artifact@v4
        with:
          name: reporter-macos
          path: dist/reporter
