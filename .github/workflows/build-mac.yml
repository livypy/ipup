name: Build macOS reporter

"on":
  workflow_dispatch:
  push:
    paths: ['reporter.py']

jobs:
  build-mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests cryptography pyinstaller

      - run: pyinstaller --onefile reporter.py

      - uses: actions/upload-artifact@v4
        with:
          name: reporter-macos
          path: dist/reporter
